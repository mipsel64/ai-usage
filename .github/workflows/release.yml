name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the disk image
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Xcode build
        run: test "$(xcodebuild -version | tail -1)" = 'Build version 17F42'
      - name: Check the tag against the bundle version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Packaging/Info.plist)"
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vX.Y.Z or vX.Y.Z-<suffix>."
            exit 1
          fi
          tag_version="${tag#v}"
          tag_version="${tag_version%%-*}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Tag '$tag' does not match CFBundleShortVersionString '$version' in Packaging/Info.plist."
            exit 1
          fi
      - name: Test providers and reset handling
        run: swift test --disable-xctest
      - name: Build and verify the disk image
        run: |
          make dmg
          plutil -lint '.build/AI Usage.app/Contents/Info.plist'
          codesign --verify --deep --strict '.build/AI Usage.app'
          dmg="$(ls .build/AI-Usage-*.dmg)"
          hdiutil verify "$dmg"
          cd .build && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          prerelease=()
          if [[ "$tag" == *-* ]]; then prerelease=(--prerelease); fi
          notes=$'AI Usage is ad hoc signed and not notarized by Apple.\nBefore the first open, read the [Install](https://github.com/mipsel64/ai-usage#install) section of the README.'
          gh release create "$tag" --verify-tag --generate-notes --notes "$notes" "${prerelease[@]}" \
            .build/AI-Usage-*.dmg .build/AI-Usage-*.dmg.sha256
